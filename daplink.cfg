# ===================================================
# OpenOCD config for STM32G491 via DAPLink (CMSIS-DAP)
# ===================================================

# Use CMSIS-DAP (DAPLink) interface
source [find interface/cmsis-dap.cfg]

# Use SWD transport (DAPLink supports SWD)
transport select swd

# Target: STM32G4xx family (covers STM32G491VETx)
# This script handles: flash banks, reset config, debug settings
source [find target/stm32g4x.cfg]

# !!! MUST come AFTER sourcing target/stm32g4x.cfg !!!
# stm32g4x.cfg line 62 contains a bare "adapter speed 2000",
# which silently overrides any speed set before it.
adapter speed 500
